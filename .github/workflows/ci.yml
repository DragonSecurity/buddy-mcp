name: CI

on:
  pull_request:
  push:
    # The org renovate preset uses automergeType "branch", so most updates never
    # open a PR. CI has to run on the renovate branch itself or there are no
    # checks for `ignoreTests: false` to gate the automerge on.
    branches: [main, 'renovate/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # node:sqlite is only usable without a flag from Node 24 onwards.
        node: ['24', '26']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # tsc typechecks and emits dist/, which the tests import.
      - run: npm run build

      - run: npm test
