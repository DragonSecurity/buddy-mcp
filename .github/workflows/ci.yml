name: CI

on:
  pull_request:
  push:
    # The org renovate preset uses automergeType "branch", so most updates never
    # open a PR. CI has to run on the renovate branch itself or there are no
    # checks for `ignoreTests: false` to gate the automerge on.
    branches: [main, 'renovate/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # node:sqlite is only usable without a flag from Node 24 onwards.
        node: ['24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # --ignore-scripts: the build and tests need no lifecycle scripts, and
      # this repo resolves 94 packages from two declared dependencies.
      - run: npm ci --ignore-scripts

      # tsc typechecks and emits dist/, which the tests import.
      - run: npm run build

      - run: npm test
